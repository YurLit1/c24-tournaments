web:
  openapi: openapi.yaml
  base: http://localhost:8080
  items: []
  instances:
    app-a: "http://localhost:8001"
    app-b: "http://localhost:8002"
  services:
    nginx: nginx
    app-a: app-a
    app-b: app-b
    postgres: postgres
  log_fields:
    time: time
    instance: instance
    route: route
    status: status
    duration: duration_ms

dpc:
  openapi: openapi.yaml
  base: http://localhost:8090
  items: []
  services:
    api: api
  load_s: 10
  resource:
    path: /v1/player-rating/00000000-0000-0000-0000-000000000001
    ok_field: invariant_ok
