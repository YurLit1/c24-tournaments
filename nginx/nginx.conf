events {}

http {
  # якщо клієнт не надіслав X-Request-ID, беремо згенерований nginx $request_id
  map $http_x_request_id $req_id {
    default $http_x_request_id;
    ""      $request_id;
  }

  log_format json escape=json '{"time":"$time_iso8601","request_id":"$req_id",'
    '"method":"$request_method","uri":"$uri","status":$status,'
    '"upstream":"$upstream_addr","duration_s":$request_time}';
  access_log /dev/stdout json;

  upstream app {
    least_conn;
    server app-a:8000;
    server app-b:8000;
  }

  server {
    listen 80;

    location / {
      proxy_pass http://app;
      proxy_set_header Host $host;
      proxy_set_header X-Request-ID $req_id;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

      # X-Request-ID ставить nginx, зокрема на власні відповіді 502/504
      proxy_hide_header X-Request-ID;
      add_header X-Request-ID $req_id always;
    }
  }
}
