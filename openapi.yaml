openapi: 3.1.0
info:
  title: C24 Tournaments
  version: 0.1.0
  description: |
    C24 «Ігрові турніри» — спільний проєкт курсів «Обмін даними у Web-застосунках» (tag web)
    і «Технології розподілених систем та паралельних обчислень» (tag dpc).
    До ЛР3 заголовок X-User-Id містить id заздалегідь створеного користувача
    (гравці 00000000-0000-0000-0000-000000000001 … 000000000010).
    Помилки — Problem Details (RFC 9457).
  license:
    name: MIT
    identifier: MIT
servers:
  - url: http://localhost:8080
    description: nginx перед app-a і app-b
tags:
  - name: web
    description: Частина Web — турніри та реєстрації
  - name: dpc
    description: Частина DPC — результати матчів і рейтинги (маршрути додає учасник B)
  - name: service
    description: Службові маршрути

paths:
  /health:
    get:
      tags: [service]
      operationId: health
      summary: Перевірка живучості процесу без звернення до бази
      security: []
      responses:
        '200':
          description: Процес живий
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
              examples:
                ok: { value: { status: ok, instance: app-a } }

  /v1/tournaments:
    get:
      tags: [web]
      operationId: listTournaments
      summary: Список турнірів із кількістю вільних місць
      security: []
      responses:
        '200':
          description: Турніри за часом початку
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TournamentList' }
              examples:
                ok:
                  value:
                    items:
                      - id: 10000000-0000-0000-0000-000000000001
                        game: Dota 2
                        starts_at: '2027-06-05T09:00:00+00:00'
                        time_zone: Europe/Kyiv
                        slots: 64
                        available: 64
                        fee_minor: 5000
                        currency: UAH
                        registration_open: true
                      - id: 10000000-0000-0000-0000-000000000002
                        game: CS2
                        starts_at: '2027-06-12T09:00:00+00:00'
                        time_zone: Europe/Kyiv
                        slots: 2
                        available: 2
                        fee_minor: 0
                        currency: UAH
                        registration_open: true
        '500': { $ref: '#/components/responses/Problem' }

  /v1/registrations:
    post:
      tags: [web]
      operationId: createRegistration
      summary: Зареєструватися на турнір (головна операція)
      x-course: main
      description: |
        В одній транзакції умовним UPDATE списується вільне місце
        (`available > 0`, реєстрацію відкрито, турнір не почався) і створюється
        реєстрація в стані `held` до `expires_at` (+15 хвилин).
        Відповідь 201 надсилається лише після COMMIT.
        Власник реєстрації визначається за X-User-Id, а не за тілом запиту.
      security: [{ UserId: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegistrationCreate' }
            examples:
              normal:
                summary: Турнір Dota 2, місць достатньо
                value: { tournament_id: 10000000-0000-0000-0000-000000000001, nickname: neo }
              scarce:
                summary: Турнір CS2 на 2 місця — для досліду гонки й 409
                value: { tournament_id: 10000000-0000-0000-0000-000000000002, nickname: trinity }
                x-capacity: 2
              missing:
                summary: Такого турніру немає — 404
                value: { tournament_id: 10000000-0000-0000-0000-000000000777, nickname: neo }
      responses:
        '201':
          description: Реєстрацію створено, місце утримано
          headers:
            Location:
              description: URL нової реєстрації
              schema: { type: string }
              example: /v1/registrations/6f1c2a7e-3b0d-4c55-9a43-2f1d0e9b8c71
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Registration' }
              examples:
                created:
                  value:
                    id: 6f1c2a7e-3b0d-4c55-9a43-2f1d0e9b8c71
                    tournament_id: 10000000-0000-0000-0000-000000000001
                    nickname: neo
                    status: held
                    version: 1
                    created_at: '2026-10-17T20:00:00.000000+00:00'
                    expires_at: '2026-10-17T20:15:00.000000+00:00'
        '400':
          description: Тіло — не JSON
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              examples:
                malformed:
                  value: { type: about:blank, title: Malformed JSON, status: 400, detail: Request body is not valid JSON, instance: /v1/registrations }
        '404':
          description: Турніру немає
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              examples:
                notFound:
                  value: { type: about:blank, title: Tournament not found, status: 404, detail: No tournament 10000000-0000-0000-0000-000000000777, instance: /v1/registrations }
        '409':
          description: Місць немає / реєстрацію закрито / гравець або нікнейм уже зареєстровані
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              examples:
                noSlots:
                  value: { type: about:blank, title: No free slots, status: 409, detail: Registration is closed or all slots are taken, instance: /v1/registrations }
                alreadyRegistered:
                  value: { type: about:blank, title: Already registered, status: 409, detail: Active registration of this player or this nickname already exists, instance: /v1/registrations }
        '422':
          description: Неправильні дані (нікнейм поза 3–32 символами, id не UUID, немає X-User-Id, невідомий користувач)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              examples:
                badNickname:
                  value: { type: about:blank, title: Invalid data, status: 422, detail: 'body.nickname: String should have at least 3 characters', instance: /v1/registrations }
        '500': { $ref: '#/components/responses/Problem' }

  /v1/registrations/{registration_id}:
    get:
      tags: [web]
      operationId: getRegistration
      summary: Власна реєстрація за id
      x-course: object
      security: [{ UserId: [] }]
      parameters:
        - name: registration_id
          in: path
          required: true
          schema: { type: string, format: uuid }
          example: 6f1c2a7e-3b0d-4c55-9a43-2f1d0e9b8c71
      responses:
        '200':
          description: Реєстрація
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Registration' }
              examples:
                held:
                  value:
                    id: 6f1c2a7e-3b0d-4c55-9a43-2f1d0e9b8c71
                    tournament_id: 10000000-0000-0000-0000-000000000001
                    nickname: neo
                    status: held
                    version: 1
                    created_at: '2026-10-17T20:00:00.000000+00:00'
                    expires_at: '2026-10-17T20:15:00.000000+00:00'
        '404':
          description: Такої реєстрації немає або вона чужа
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              examples:
                notFound:
                  value: { type: about:blank, title: Registration not found, status: 404, detail: No registration 6f1c2a7e-3b0d-4c55-9a43-2f1d0e9b8c71, instance: /v1/registrations/6f1c2a7e-3b0d-4c55-9a43-2f1d0e9b8c71 }
        '422': { $ref: '#/components/responses/Problem' }

  /v1/match-results:
    post:
      tags: [dpc]
      operationId: submitMatchResult
      summary: Прийняти результат матчу в чергу (DPC)
      x-course: receiver
      description: |
        Сервіс api (http://localhost:8090). Запит записується зі станом `queued` і ставиться
        в обмежену чергу місткістю QUEUE_CAPACITY; відповідь 202 надсилається до обробки.
        Обробник проходить повільну перевірку на ігровому сервері (100–500 мс) і змінює
        рейтинги гравців. Стани: queued → processing → done | rejected | failed.
        Якщо черга заповнена — одразу 429 з Retry-After.
      servers: [{ url: http://localhost:8090 }]
      security: [{ Bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MatchResultCreate' }
            examples:
              normal:
                summary: Гравець 1 переміг гравця 2 у новому матчі
                value:
                  match_id: '{uuid}'
                  winner_id: 00000000-0000-0000-0000-000000000001
                  loser_id: 00000000-0000-0000-0000-000000000002
      responses:
        '202':
          description: Запит прийнято в чергу
          headers:
            Location:
              description: URL стану запиту
              schema: { type: string }
              example: /v1/match-results/3f0c6a51-7d2e-4f8a-b1c4-5e6d7f8a9b0c
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MatchResultAccepted' }
              examples:
                queued: { value: { id: 3f0c6a51-7d2e-4f8a-b1c4-5e6d7f8a9b0c, state: queued } }
        '400': { $ref: '#/components/responses/Problem' }
        '401':
          description: Немає або неправильний токен
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              examples:
                noToken:
                  value: { type: about:blank, title: Unauthorized, status: 401, detail: Missing or invalid bearer token, instance: /v1/match-results }
        '422': { $ref: '#/components/responses/Problem' }
        '429':
          description: Черга заповнена, запит не прийнято
          headers:
            Retry-After:
              description: Через скільки секунд повторити
              schema: { type: integer }
              example: 1
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              examples:
                full:
                  value: { type: about:blank, title: Queue is full, status: 429, detail: 'Queue capacity 50 reached, retry later', instance: /v1/match-results }

  /v1/match-results/{request_id}:
    get:
      tags: [dpc]
      operationId: getMatchResult
      summary: Стан запиту на результат матчу (DPC)
      x-course: request-state
      servers: [{ url: http://localhost:8090 }]
      security: [{ Bearer: [] }]
      parameters:
        - name: request_id
          in: path
          required: true
          schema: { type: string, format: uuid }
          example: 3f0c6a51-7d2e-4f8a-b1c4-5e6d7f8a9b0c
      responses:
        '200':
          description: Стан запиту
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MatchResult' }
              examples:
                done:
                  value:
                    id: 3f0c6a51-7d2e-4f8a-b1c4-5e6d7f8a9b0c
                    match_id: 20000000-0000-0000-0000-000000000001
                    winner_id: 00000000-0000-0000-0000-000000000001
                    loser_id: 00000000-0000-0000-0000-000000000002
                    state: done
                    reason: null
                    created_at: '2026-10-19T10:00:00.000000+00:00'
                    updated_at: '2026-10-19T10:00:00.350000+00:00'
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /v1/player-rating/{player_id}:
    get:
      tags: [dpc]
      operationId: getPlayerRating
      summary: Рейтинг гравця (спільний ресурс DPC) і перевірка інваріанта
      x-course: resource-state
      servers: [{ url: http://localhost:8090 }]
      security: [{ Bearer: [] }]
      parameters:
        - name: player_id
          in: path
          required: true
          schema: { type: string, format: uuid }
          example: 00000000-0000-0000-0000-000000000001
      responses:
        '200':
          description: Рейтинг і версія
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlayerRating' }
              examples:
                rating: { value: { player_id: 00000000-0000-0000-0000-000000000001, rating: 1516, version: 1, invariant_ok: true } }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

components:
  securitySchemes:
    UserId:
      type: apiKey
      in: header
      name: X-User-Id
      description: До ЛР3 — id заздалегідь створеного користувача
    Bearer:
      type: http
      scheme: bearer
      description: Токен сервісу api (DPC), API_TOKEN із .env (типово dev-token)

  responses:
    Problem:
      description: Помилка у форматі RFC 9457
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            invalid:
              value: { type: about:blank, title: Invalid data, status: 422, detail: 'header.x-user-id: Field required', instance: /v1/registrations }

  schemas:
    Problem:
      type: object
      description: Problem Details (RFC 9457)
      required: [type, title, status]
      properties:
        type: { type: string, example: about:blank }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }

    Health:
      type: object
      required: [status, instance]
      properties:
        status: { type: string, enum: [ok] }
        instance: { type: string, description: 'app-a або app-b' }

    Tournament:
      type: object
      required: [id, game, starts_at, time_zone, slots, available, fee_minor, currency, registration_open]
      properties:
        id: { type: string, format: uuid }
        game: { type: string }
        starts_at: { type: string, format: date-time, description: Момент початку (ISO 8601) }
        time_zone: { type: string, description: Назва часової зони турніру (IANA), example: Europe/Kyiv }
        slots: { type: integer, minimum: 1 }
        available: { type: integer, minimum: 0, description: 'Вільні місця, 0 ≤ available ≤ slots' }
        fee_minor: { type: integer, format: int64, minimum: 0, description: Внесок у копійках }
        currency: { type: string, pattern: '^[A-Z]{3}$', example: UAH }
        registration_open: { type: boolean }

    TournamentList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Tournament' }

    RegistrationCreate:
      type: object
      required: [tournament_id, nickname]
      properties:
        tournament_id: { type: string, format: uuid }
        nickname: { type: string, minLength: 3, maxLength: 32 }

    Registration:
      type: object
      required: [id, tournament_id, nickname, status, version, created_at, expires_at]
      properties:
        id: { type: string, format: uuid }
        tournament_id: { type: string, format: uuid }
        nickname: { type: string }
        status: { type: string, enum: [held, confirmed, expired, cancelled] }
        version: { type: integer, minimum: 1 }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time, description: Сплатити внесок до цього моменту }

    MatchResultCreate:
      type: object
      required: [match_id, winner_id, loser_id]
      properties:
        match_id: { type: string, format: uuid }
        winner_id: { type: string, format: uuid, description: player_id переможця }
        loser_id: { type: string, format: uuid, description: 'player_id переможеного, не дорівнює winner_id' }

    MatchResultAccepted:
      type: object
      required: [id, state]
      properties:
        id: { type: string, format: uuid }
        state: { type: string, enum: [queued] }

    MatchResult:
      type: object
      required: [id, match_id, winner_id, loser_id, state, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        match_id: { type: string, format: uuid }
        winner_id: { type: string, format: uuid }
        loser_id: { type: string, format: uuid }
        state: { type: string, enum: [queued, processing, done, rejected, failed] }
        reason: { type: [string, 'null'], description: Причина rejected або failed }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    PlayerRating:
      type: object
      required: [player_id, rating, version, invariant_ok]
      properties:
        player_id: { type: string, format: uuid }
        rating: { type: integer }
        version: { type: integer, minimum: 0, description: Кількість застосованих змін рейтингу }
        invariant_ok:
          type: boolean
          description: 'Сума рейтингів усіх гравців = 1500 × кількість гравців і сума version = 2 × кількість застосованих результатів'
